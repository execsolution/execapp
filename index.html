<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EXEC APP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0b0b13; color: #fff; padding: 20px; overflow-x: hidden; }
        
        .header-title { text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 2px; margin-bottom: 30px; text-transform: uppercase; color: #e0e0e0; }
        
        .card { background: #151522; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        .label { font-size: 12px; font-weight: 600; color: #888; margin-bottom: 10px; display: block; text-transform: uppercase; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-toggle { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: default; }
        .btn-toggle.active { background: linear-gradient(135deg, #6e8efb, #a777e3); color: white; box-shadow: 0 0 15px rgba(110, 142, 251, 0.4); }
        
        /* Custom Dropdown */
        .custom-dropdown { position: relative; width: 100%; margin-bottom: 20px; }
        .dropdown-header { background: #1a1a2e; color: #fff; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .dropdown-header-content { display: flex; align-items: center; gap: 10px; }
        .dropdown-list { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #1a1a2e; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; margin-top: 5px; z-index: 100; max-height: 250px; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .dropdown-list::-webkit-scrollbar { width: 6px; }
        .dropdown-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .dropdown-item { padding: 12px 15px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .dropdown-item:hover { background: #2a2a3c; }
        .dropdown-list.show { display: block; }
        
        /* Flag Styles */
        .flag-group { display: flex; align-items: center; }
        .flag { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 2px solid #1a1a2e; }
        .flag:nth-child(2) { margin-left: -10px; }

        .timeframes { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 30px; }
        .tf-btn { flex: 1; background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); color: #888; padding: 10px 0; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .tf-btn.active { background: linear-gradient(135deg, #6e8efb, #a777e3); color: white; border: none; }
        
        .main-btn { width: 100%; background: linear-gradient(135deg, #4776E6, #8E54E9); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 0 20px rgba(71, 118, 230, 0.5); display: flex; justify-content: center; align-items: center; gap: 10px; text-transform: uppercase; transition: 0.3s; }
        
        /* Divider & Auto Signal */
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #555; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }
        
        .auto-btn { background: #1a1a2e; border: 1px solid rgba(142, 84, 233, 0.4); color: #a777e3; box-shadow: none; }
        .auto-btn:active { background: rgba(142, 84, 233, 0.2); }

        /* Loading Animation */
        #loading-page { display: none; text-align: center; padding: 40px 20px; }
        .loader { width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1); border-top: 4px solid #8E54E9; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 16px; font-weight: 600; color: #ccc; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Page 2: Result */
        #page2 { display: none; }
        .result-box { text-align: center; margin-bottom: 20px; }
        .result-pair { font-size: 24px; font-weight: 800; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .result-pair .flag { width: 30px; height: 30px; } 
        .result-direction { font-size: 32px; font-weight: 800; margin-bottom: 15px; padding: 10px; border-radius: 10px; }
        
        /* Direction Colors */
        .dir-up { color: #00e676; background: rgba(0, 230, 118, 0.1); }
        .dir-down { color: #ff1744; background: rgba(255, 23, 68, 0.1); }
        .dir-none { color: #ffab00; background: rgba(255, 171, 0, 0.1); font-size: 26px; } 
        
        .result-info { font-size: 16px; color: #ccc; margin-bottom: 20px; line-height: 1.6; }
        
        .ai-analysis { background: #1a1a2e; border-left: 4px solid #8E54E9; padding: 15px; border-radius: 8px; font-size: 13px; color: #aaa; text-align: left; margin-bottom: 30px; line-height: 1.5; }
        .ai-title { color: #8E54E9; font-weight: 800; margin-bottom: 10px; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        
        .back-btn { background: #2a2a3c; box-shadow: none; }
    </style>
</head>
<body>

    <div class="header-title">EXEC APP</div>

    <!-- Page 1: Settings -->
    <div id="page1" class="card">
        <span class="label">Signal Type</span>
        <div class="btn-group">
            <button class="btn-toggle active">OTC</button>
        </div>

        <span class="label">Currency Pair</span>
        <div class="custom-dropdown" id="custom-pair-dropdown">
            <div class="dropdown-header" onclick="toggleDropdown()">
                <div class="dropdown-header-content" id="selected-pair-content">
                    <!-- Filled by JS -->
                </div>
                <span class="arrow">▼</span>
            </div>
            <div class="dropdown-list" id="dropdown-list">
                <!-- Options filled by JS -->
            </div>
        </div>

        <span class="label">Timeframe</span>
        <div class="timeframes" id="tf-container">
            <button class="tf-btn" data-tf="1M">1 M</button>
            <button class="tf-btn active" data-tf="3M">3 M</button>
            <button class="tf-btn" data-tf="5M">5 M</button>
            <button class="tf-btn" data-tf="10M">10 M</button>
        </div>

        <button class="main-btn" onclick="getSignal()">⚡ Get Signal</button>
        
        <div class="divider">OR</div>
        
        <button class="main-btn auto-btn" onclick="getAutoSignal()">✨ AUTO SIGNAL</button>
    </div>

    <!-- Loading Page -->
    <div id="loading-page" class="card">
        <div class="loader"></div>
        <div class="loading-text">AI is analyzing the market...</div>
    </div>

    <!-- Page 2: Result -->
    <div id="page2" class="card">
        <div class="result-box">
            <div class="result-pair" id="res-pair">
                <!-- Filled by JS -->
            </div>
            <div class="result-direction" id="res-dir">UP 🔼</div>
            <div class="result-info">
                Entry Time: <strong id="res-time" style="color:#fff;">12:45</strong><br>
                Timeframe: <strong id="res-tf" style="color:#fff;">3 Minutes</strong>
            </div>
        </div>

        <div class="ai-analysis">
            <div class="ai-title">🤖 AI ANALYSIS</div>
            <div id="ai-text">Analysis text...</div>
        </div>

        <button class="main-btn back-btn" onclick="goBack()">🔙 Back</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        let selectedTf = "3M";
        const tfList = ["1M", "3M", "5M", "10M"];

        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedTf = this.getAttribute('data-tf');
            });
        });

        const pairsData = [
            { id: "EUR/USD OTC", f1: "eu", f2: "us" },
            { id: "GBP/USD OTC", f1: "gb", f2: "us" },
            { id: "USD/JPY OTC", f1: "us", f2: "jp" },
            { id: "AUD/CAD OTC", f1: "au", f2: "ca" },
            { id: "NZD/USD OTC", f1: "nz", f2: "us" },
            { id: "EUR/GBP OTC", f1: "eu", f2: "gb" },
            { id: "USD/CHF OTC", f1: "us", f2: "ch" },
            { id: "CAD/CHF OTC", f1: "ca", f2: "ch" },
            { id: "AUD/CHF OTC", f1: "au", f2: "ch" },
            { id: "GBP/JPY OTC", f1: "gb", f2: "jp" },
            { id: "EUR/JPY OTC", f1: "eu", f2: "jp" },
            { id: "AUD/USD OTC", f1: "au", f2: "us" }
        ];

        let selectedPair = pairsData[0].id;

        const aiAnalysisTexts = {
            "EUR/USD OTC": "The advanced neural network has detected a significant accumulation of hidden liquidity blocks in the Eurozone sector. Micro-pulse analysis indicates an imminent breakout from the current consolidation zone. Institutional algorithms are shifting order flows, creating a strong divergence on the higher timeframe RSI and MACD. The probability model suggests a high-momentum directional impulse as the market makers clear out retail stop-loss clusters.",
            "GBP/USD OTC": "Deep machine learning models are registering anomalies in the British Pound's synthetic order book. The asset is currently testing a critical historical Fibonacci retracement level amidst synthetic macroeconomic uncertainty. Cross-referencing tick volume with Bollinger Band standard deviations reveals extreme compression. The AI forecasts a violent volatility expansion, overriding immediate support/resistance structures.",
            "USD/JPY OTC": "Algorithmic sentiment tracking shows extreme overbought/oversold conditions on the synthetic Yen crosses. The AI has identified a textbook 'Wyckoff Schematic' forming on the sub-minute charts. Volume Profile Visible Range (VPVR) highlights a lack of liquidity at current price levels, indicating that the price will snap back to the high-volume node. Prepare for a sharp reversion to the mean.",
            "AUD/CAD OTC": "Synthetic commodity correlations are driving heavy algorithmic arbitrage in this pair. The AI detects a breakdown in the standard pricing model, leading to momentary inefficiencies in the bid-ask spread. By analyzing fractal patterns across multi-timeframe structures, the system anticipates a strong continuation of the underlying trend. Moving average ribbon crossovers confirm the imminent directional bias.",
            "NZD/USD OTC": "The predictive model has flagged a severe volatility cluster approaching. Order flow analysis shows a massive absorption of market orders by passive limit participants, signaling a trap for retail traders. The AI's proprietary Elliott Wave count suggests we are entering the explosive Wave 3 of the current cycle. Expect rapid price discovery in the projected direction.",
            "EUR/GBP OTC": "Cross-currency algorithmic trading bots are highly active, creating a synthetic squeeze matrix. The AI notes a convergence of 50-period and 200-period Exponential Moving Averages on the tick chart, preceding a major volume event. Liquidity heatmaps show heavy stop-loss resting orders just beyond the local swing points. The system expects these stops to be hunted, driving the projected move.",
            "USD/CHF OTC": "Safe-haven synthetic flows are dominating the tape. The AI's deep-learning cluster recognizes a multi-fractal continuation pattern building up momentum. Stochastic oscillators on the underlying tick data are displaying hidden divergence, indicating that the current pullback is merely a shakeout. The algorithm gives an 89% confidence rating for the subsequent impulse wave.",
            "CAD/CHF OTC": "The intersection of synthetic oil derivatives and safe-haven proxy data has created a unique trading window. The AI has calculated the exact standard deviation bands and notes the price is currently rejecting the outer limits. A mean-reversion algorithm has been triggered, supported by a sudden spike in synthetic tick volume. The projected vector aligns with the path of least resistance.",
            "AUD/CHF OTC": "High-frequency trading (HFT) patterns indicate aggressive spoofing in the synthetic order book. The AI filters out the noise and identifies the true institutional intent through VWAP deviations. The asset is currently compressed within a tightening volatility matrix. A breakout is mathematically imminent as the algorithmic tension reaches its critical threshold.",
            "GBP/JPY OTC": "Known for its extreme synthetic volatility, the data matrix is exhibiting signs of algorithmic harmonic completion. The AI detects a perfect geometric pattern mapping out the next liquidity sweep. Order book depth analysis reveals a vacuum of liquidity in the target zone, meaning price will move there rapidly once triggered. Risk-to-reward metrics are highly favorable.",
            "EUR/JPY OTC": "The AI model is tracking a major synthetic carry-trade unwinding event. Price action is forming a classic continuation flag, but internal volume metrics suggest a trap is being set. By analyzing the delta between market buys and sells, the system confirms the presence of hidden institutional absorption. The resulting price shock will follow the path projected by the neural network.",
            "AUD/USD OTC": "Synthetic macroeconomic data feeds indicate a sudden shift in risk sentiment parameters. The AI's clustering algorithm has grouped similar historical price action models and predicts a 92% correlation with a historical high-momentum breakout. The Chaikin Money Flow indicator confirms stealth accumulation. The algorithm advises executing the trade precisely at the calculated timestamp."
        };

        function renderFlags(f1, f2) {
            return `<div class="flag-group">
                        <img class="flag" src="https://flagcdn.com/w40/${f1}.png" alt="${f1}">
                        <img class="flag" src="https://flagcdn.com/w40/${f2}.png" alt="${f2}">
                    </div>`;
        }

        const dropdownList = document.getElementById('dropdown-list');
        const selectedPairContent = document.getElementById('selected-pair-content');

        function updateSelected(pairId) {
            selectedPair = pairId;
            const pair = pairsData.find(p => p.id === pairId);
            selectedPairContent.innerHTML = `${renderFlags(pair.f1, pair.f2)}<span>${pair.id}</span>`;
        }

        pairsData.forEach(pair => {
            const item = document.createElement('div');
            item.className = 'dropdown-item';
            item.innerHTML = `${renderFlags(pair.f1, pair.f2)}<span>${pair.id}</span>`;
            item.onclick = (e) => {
                e.stopPropagation();
                updateSelected(pair.id);
                dropdownList.classList.remove('show');
            };
            dropdownList.appendChild(item);
        });

        function toggleDropdown() { dropdownList.classList.toggle('show'); }

        document.addEventListener('click', function(e) {
            if (!document.getElementById('custom-pair-dropdown').contains(e.target)) {
                dropdownList.classList.remove('show');
            }
        });

        updateSelected(pairsData[0].id); 

        // Функция случайного выбора параметров (Автосигнал)
        function getAutoSignal() {
            // 1. Выбираем случайную пару
            const randomPairIndex = Math.floor(Math.random() * pairsData.length);
            updateSelected(pairsData[randomPairIndex].id);

            // 2. Выбираем случайный таймфрейм
            const randomTfIndex = Math.floor(Math.random() * tfList.length);
            selectedTf = tfList[randomTfIndex];

            // 3. Визуально переключаем кнопку таймфрейма
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-tf') === selectedTf) {
                    btn.classList.add('active');
                }
            });

            // 4. Запускаем стандартный генератор сигнала
            getSignal();
        }

        function getSignal() {
            document.getElementById('page1').style.display = 'none';
            document.getElementById('loading-page').style.display = 'block';

            setTimeout(() => {
                const dirElement = document.getElementById('res-dir');
                const aiTextElement = document.getElementById('ai-text');
                
                const now = new Date();
                now.setMinutes(now.getMinutes() + 1);
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                
                const pairObj = pairsData.find(p => p.id === selectedPair);
                document.getElementById('res-pair').innerHTML = `${renderFlags(pairObj.f1, pairObj.f2)} <span>${selectedPair}</span>`;
                document.getElementById('res-tf').innerText = selectedTf.replace('M', ' Minutes');

                const signalChance = Math.random();

                if (signalChance < 0.05) {
                    dirElement.innerHTML = 'NO SIGNAL ⚠️';
                    dirElement.className = 'result-direction dir-none';
                    document.getElementById('res-time').innerText = '--:--'; 
                    aiTextElement.innerText = "The neural network cannot confidently predict the market behavior at this moment due to anomalous order flow and extreme volatility. The AI cannot guarantee a safe entry point. Please change the currency pair or try again later.";
                } else {
                    const isUp = Math.random() > 4;
                    if (isUp) {
                        dirElement.innerHTML = 'UP 🔼';
                        dirElement.className = 'result-direction dir-up';
                    } else {
                        dirElement.innerHTML = 'DOWN 🔽';
                        dirElement.className = 'result-direction dir-down';
                    }
                    document.getElementById('res-time').innerText = `${hours}:${minutes}`;
                    aiTextElement.innerText = aiAnalysisTexts[selectedPair];
                }

                document.getElementById('loading-page').style.display = 'none';
                document.getElementById('page2').style.display = 'block';
            }, 5000); 
        }

        function goBack() {
            document.getElementById('page2').style.display = 'none';
            document.getElementById('page1').style.display = 'block';
        }
    </script>
</body>
</html>
